<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecurePass – Autenticação</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
    .logo-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.15);
      border: 2px solid rgba(37, 99, 235, 0.4);
      display: grid;
      place-items: center;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    .logo-ring svg { color: #3b82f6; }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.25); }
      50%       { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
    }
    h2 { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
    .subtitle { font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }
    .auth-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(37, 99, 235, 0.4);
      background: rgba(37, 99, 235, 0.2);
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .auth-btn:hover:not(:disabled) {
      background: rgba(37, 99, 235, 0.4);
      border-color: rgba(37, 99, 235, 0.7);
    }
    .auth-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .cancel-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .cancel-btn:hover { color: #94a3b8; }
    .error-msg {
      font-size: 0.78rem;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
      display: none;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-row { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-ring">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <div>
      <h2 id="title">Confirma a tua identidade</h2>
      <p class="subtitle" id="subtitle">Usa a biometria do dispositivo ou o PIN<br>para autorizar o preenchimento.</p>
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="auth-btn" id="auth-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 11c0-1.1.9-2 2-2s2 .9 2 2v1h-4v-1z"/>
        <ellipse cx="12" cy="8" rx="4" ry="5" stroke-width="2"/>
        <rect x="4" y="13" width="16" height="8" rx="2" stroke-width="2"/>
      </svg>
      <span id="auth-btn-text">Autorizar</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <button class="cancel-btn" id="cancel-btn">Cancelar</button>
  </div>
  <script src="auth.js" type="module"></script>
</body>
</html>
